name: Generate EF migration

# Manual: creates (or adds) an EF Core migration and commits it to the branch.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Migration name (for example InitialCreate)"
        required: true
        default: "InitialCreate"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef
      - name: Add migration
        run: >
          dotnet ef migrations add "${{ github.event.inputs.name }}"
          --project src/Zemanat.Data --startup-project src/Zemanat.Web
          --output-dir Migrations
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Zemanat.Data/Migrations
          git commit -m "Add EF migration ${{ github.event.inputs.name }}" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

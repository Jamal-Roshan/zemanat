name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Zemanat.sln

      - name: Build
        run: dotnet build Zemanat.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test Zemanat.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish web app
        run: dotnet publish src/Zemanat.Web/Zemanat.Web.csproj -c Release --no-build -o publish

      - name: Upload published web app
        uses: actions/upload-artifact@v4
        with:
          name: zemanat-web
          path: publish
